# Defaults for ViT-S DINO training.
compute_precision:
  param_dtype: bf16
  reduce_dtype: fp32
  sharding_strategy: SHARD_GRAD_OP
dino:
  loss_weight: 1.0
  global_ignore_diagonal: true
  head_n_prototypes: 65536
  head_bottleneck_dim: 256
  head_norm_last_layer: false
  head_nlayers: 3
  head_hidden_dim: 2048
  koleo_loss_weight: 0.1
ibot:
  loss_weight: 1.0
  mask_sample_probability: 0.5
  mask_ratio_min_max:
  - 0.1
  - 0.5
  separate_head: true
  head_n_prototypes: 65536
  head_bottleneck_dim: 256
  head_norm_last_layer: false
  head_nlayers: 3
  head_hidden_dim: 2048
train:
  batch_size_per_gpu: 224
  dataset_path: ???
  output_dir: outputs/train
  seed: 0
  num_workers: 10
  OFFICIAL_EPOCH_LENGTH: 1430
  checkpointing: false
  checkpointing_full: false
  compile: true
  cudagraphs: false
  cache_dataset: true
student:
  arch: vit_small
  patch_size: 16
  drop_path_rate: 0.1
  layerscale: 1.0e-05
  ffn_layer: mlp
  qkv_bias: true
  proj_bias: true
  ffn_bias: true
  norm_layer: layernorm
  n_storage_tokens: 0
  num_vanilla_heads: 6
  mask_k_bias: false
  untie_cls_and_patch_norms: false
  untie_global_and_local_cls_norm: false
  pos_embed_rope_base: 100.0
  pos_embed_rope_min_period: null
  pos_embed_rope_max_period: null
  pos_embed_rope_normalize_coords: separate
  pos_embed_rope_shift_coords: null
  pos_embed_rope_jitter_coords: null
  pos_embed_rope_rescale_coords: null
  resume_from_teacher_chkpt: ''
optim:
  epochs: 100
  scaling_rule: sqrt_wrt_1024
  clip_grad: 3.0
  patch_embed_lr_mult: 0.2
  dino_head_wd_multiplier: 1.0
  layerwise_decay: 0.95
  multi_tensor_optim: true
  adamw_beta1: 0.9
  adamw_beta2: 0.999
schedules:
  lr:
    start: 0.0
    peak: 0.0015
    end: 1.0e-06
    warmup_epochs: 10
    freeze_last_layer_epochs: 1
  weight_decay:
    start: 0.04
    peak: 0.1
    end: 0.1
    warmup_epochs: 10
  momentum:
    start: 0.992
    peak: 0.992
    end: 0.992
    warmup_epochs: 0
  teacher_temp:
    start: 0.04
    peak: 0.07
    end: 0.07
    warmup_epochs: 30
crops:
  global_crops_scale:
  - 0.32
  - 1.0
  local_crops_scale:
  - 0.05
  - 0.32
  local_crops_number: 8
  global_crops_size: 224
  local_crops_size: 96
  horizontal_flips: true
  rgb_mean:
  - 0.485
  - 0.456
  - 0.406
  rgb_std:
  - 0.229
  - 0.224
  - 0.225
evaluation:
  eval_period_iterations: 14300
checkpointing:
  period: 4290
  max_to_keep: 2
  keep_every: 99999999999999999
wandb:
  enabled: false
  project: dinov3_pretrain
  entity: null
  name: laplacian-heads
  id: null

# ViT-S/16, four GPUs, global batch 896, 143000 optimizer steps.
train:
  batch_size_per_gpu: 224
  dataset_path: ???
  output_dir: outputs/train
  seed: 0
  num_workers: 10
  OFFICIAL_EPOCH_LENGTH: 1430
  checkpointing: false
  compile: true
  cudagraphs: false
  cache_dataset: true
student:
  arch: vit_small
  patch_size: 16
  drop_path_rate: 0.1
  layerscale: 1.0e-05
  ffn_layer: mlp
  qkv_bias: true
  proj_bias: true
  ffn_bias: true
  norm_layer: layernorm
  n_storage_tokens: 0
  num_vanilla_heads: 6
  mask_k_bias: false
  pos_embed_rope_base: 100.0
  pos_embed_rope_min_period: null
  pos_embed_rope_max_period: null
  pos_embed_rope_normalize_coords: separate
  pos_embed_rope_shift_coords: null
  pos_embed_rope_jitter_coords: null
  pos_embed_rope_rescale_coords: null
  resume_from_teacher_chkpt: ''
optim:
  epochs: 100
  clip_grad: 3.0
  patch_embed_lr_mult: 0.2
  dino_head_wd_multiplier: 1.0
  layerwise_decay: 0.95
  multi_tensor_optim: true
  adamw_beta1: 0.9
  adamw_beta2: 0.999
schedules:
  lr:
    start: 0.0
    peak: 0.0015
    end: 1.0e-06
    warmup_epochs: 10
    freeze_last_layer_epochs: 1
  weight_decay:
    start: 0.04
    peak: 0.1
    end: 0.1
    warmup_epochs: 10
  momentum:
    start: 0.992
    peak: 0.992
    end: 0.992
    warmup_epochs: 0
  teacher_temp:
    start: 0.04
    peak: 0.07
    end: 0.07
    warmup_epochs: 30
crops:
  global_crops_scale:
  - 0.32
  - 1.0
  local_crops_scale:
  - 0.05
  - 0.32
  local_crops_number: 8
  global_crops_size: 224
  local_crops_size: 96
  horizontal_flips: true
evaluation:
  eval_period_iterations: 14300
checkpointing:
  period: 4290
  max_to_keep: 2
